subject_id: S001
# model_name and optimization values below are only used by explicit post-
# collection training/test commands. The GUI data-collection path ignores them.
model_name: cbramod
device_type: neuracle
hardware_dummy_mode: false
sfreq: 200
task_paradigm: binary_hand_mi
n_classes: 2
window_sec: 4.0
step_sec: 0.5
confidence_threshold: 0.5
mc_dropout_passes: 8
training_epochs: 50
batch_size: 32
learning_rate: 0.001
test_mode_block_sec: 10
buffer_sec: 60
protocol:
  # Post-collection windowing is fixed in code: one complete 4 s window
  # beginning exactly at arrow/motor-imagery onset.
  # Every trial is fixed in code: 0-2 s fixation, 2-4 s hand-movement cue,
  # 4-8 s arrow-guided motor imagery.
  # Nine 100-trial blocks give 900 trials; each block has 50 trials per class.
  collection_blocks: 9
  collection_trials_per_class_per_block: 50
  # Automatic three-minute break after every completed 100-trial block.
  rest_between_blocks_sec: 180.0
  random_seed: 17
device:
  neuracle_host: 127.0.0.1
  neuracle_port: 8712
  # Neuracle/JellyFish hardware forwards at 250 Hz. Retained continuous EEG is
  # preprocessed/resampled to 200 Hz before model windows are cut.
  neuracle_source_sfreq: 250
  # Optional constant one-way-delay compensation from amplifier sample time to
  # JellyFish delivery. It is one fixed offset, not a per-trial value. Keep it
  # at 0.0 when no independent measurement is available; slow device/PC clock
  # drift is tracked separately from recent packet timing.
  neuracle_transport_delay_sec: 0.0
  neuracle_eeg_channels: 59
  # Verified from the native 64-channel BDF files recorded on 2026-07-25 and
  # 2026-07-27. The five excluded channels are ECG/HEOR/HEOL/VEOU/VEOL.
  # JellyFish is matched by name at startup; missing or duplicate channels stop
  # the formal run instead of silently changing the model input montage.
  neuracle_eeg_channel_names:
  - Fpz
  - Fp1
  - Fp2
  - AF3
  - AF4
  - AF7
  - AF8
  - Fz
  - F1
  - F2
  - F3
  - F4
  - F5
  - F6
  - F7
  - F8
  - FCz
  - FC1
  - FC2
  - FC3
  - FC4
  - FC5
  - FC6
  - FT7
  - FT8
  - Cz
  - C1
  - C2
  - C3
  - C4
  - C5
  - C6
  - T7
  - T8
  - CP1
  - CP2
  - CP3
  - CP4
  - CP5
  - CP6
  - TP7
  - TP8
  - Pz
  - P3
  - P4
  - P5
  - P6
  - P7
  - P8
  - POz
  - PO3
  - PO4
  - PO5
  - PO6
  - PO7
  - PO8
  - Oz
  - O1
  - O2
  # Hardware-free formal tests reproduce the same 250 Hz, 59-EEG-channel
  # acquisition boundary. The shared pipeline then resamples to 200 Hz.
  dummy_source_sfreq: 250
  dummy_eeg_channels: 59
  brainco_addr: ''
  brainco_port: 0
  # BrainCo hardware acquires at 250 Hz; retained continuous EEG is processed
  # and resampled to 200 Hz before model windows are cut.
  brainco_source_sfreq: 250
  brainco_auto_discover: true
  brainco_scan_timeout_sec: 6.0
  brainco_ready_timeout_sec: 20.0
  brainco_start_retries: 2
  brainco_gain: 6
  brainco_signal_source: NORMAL
  brainco_device_id: eeg-cap
  dummy_label_aware: false
output:
  command_stream_name: oi_mi_commands
  command_stream_type: Markers
  ar_game:
    enabled: true
    host: 127.0.0.1
    port: 5005
    # Unity applies scene layouts on its main thread. Allow ordinary frame or
    # Windows scheduling stalls without falsely abandoning a valid scene.
    timeout_sec: 3.0
    # Optional delay compensation from Unity's scene ACK to obstacle visibility.
    # Keep this at 0.0 when no independent measurement is available.
    visual_onset_delay_sec: 0.0
    auto_launch: true
    executable_path: ../oi-car-unity-src/Car_game/Builds/Windows/ARPrototype3D.exe
    startup_timeout_sec: 15.0
    startup_command_delay_sec: 0.75
    startup_sequence:
    - command: OPEN_3D_GAME
      delay_after_sec: 2.0
    windowed: true
    window_width: 1280
    window_height: 720
    resizable_window: true
    close_on_stop: false
  web_control:
    enabled: true
    host: 0.0.0.0
    port: 8765
    manual_override_hold_sec: 0.8
    manual_override_release_sec: 0.25
storage:
  models_dir: models_storage
  records_dir: records_storage
  record_realtime_default: true
online_adaptation:
  enabled: true
  strategy: neuroonline
  neuroonline:
    # External sample quantities are always seconds. Runtime window counts are
    # derived from window_duration_sec and rounded upward.
    window_duration_sec: 4.0
    learning_rate: 3.0e-5
    update_batch_seconds: 64.0
    epochs: 3
    first_update_seconds: 32.0
    update_stride_seconds: 32.0
    recent_history_seconds: 640.0
    weight_decay: 5.0e-2
    mask_ratio: 0.5
    consistency_weight: 1.0
    label_smoothing: 0.1
    prompt_count: 32
    # Online seed only controls stochastic masks and batch ordering during
    # realtime updates. Offline calibration uses an independent fixed seed.
    random_seed: 2026
    offline_random_seed: 42
    offline_epochs: 50
    offline_batch_seconds: 32.0
    # Current validated offline baseline. The planned shared-parameter joint
    # search is not yet treated as a project default.
    offline_learning_rate: 1.0e-4
    offline_mask_ratio: 0.1
    offline_consistency_weight: 0.1
    offline_classification_views: all
    offline_selection_metric: window_bacc
    update_policy: full
    backbone_learning_rate: 3.0e-5
    offline_update_policy: full
    offline_backbone_learning_rate: 1.0e-4
  simulation:
    enabled: false
    trial_sec: 6.0
    settle_sec: 2.0
  cued_labels:
    enabled: true
    # Unity holds one obstacle layout for this epoch. Forward motion and
    # decoding continue, but lateral commands are causally gated until the
    # clean current-Scene decision window has completed.
    # Every Scene resets the car to the center lane, so LEFT/RIGHT remain
    # balanced and independent of the previous model output. The obstacle wall
    # remains visible and serves as the subject's action instruction.
    # A collision only records failure; the next scene still starts at the
    # fixed 5 s boundary.
    scene_duration_sec: 5.0
    # Collect the selected centered 4 s window at 0.5-4.5 s, then release
    # lateral control. Each Scene contributes one 4-window-second sample.
    primary_windows_per_scene: 1
    primary_window_spacing_sec: 1.0
    boundary_guard_sec: 0.5
    # Windows touching the 0.5 s before or after an actual completed lane
    # transition remain decoded and recorded, but receive no training label.
    lane_transition_guard_sec: 0.5
    # 128 window-seconds/class = 32 centered 4 s scenes/class.
    balance_pool_window_seconds_per_class: 128.0
    start_delay_sec: 5.0
    # null generates and records an independent seed for every realtime session.
    random_seed: null
