<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }
    html { overflow: hidden; }
    body {
      overflow-x: hidden;
      overflow-y: auto;
      scrollbar-width: none;
    }
    body::-webkit-scrollbar { display: none; }
    #surface {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }
    body, #surface {
      background: #000;
    }
    body.control-only,
    body.control-only #surface {
      background: transparent;
    }
    body.control-only { overflow: hidden; }
    body.control-only #surface {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #surface { position: relative; user-select: none; }
    .hidden { display: none !important; }
    #fixation, #arrow, #message {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    #fixation {
      color: #39ff14;
      font: 500 clamp(12rem, 26vw, 25rem)/1 Arial, Helvetica, sans-serif;
    }
    #arrow {
      color: #39ff14;
      font: 500 clamp(12rem, 30vw, 28rem)/1 Arial, Helvetica, sans-serif;
      transform: translateY(-0.08em);
    }
    #hand {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(42vh, 38vw);
      aspect-ratio: 1;
      object-fit: contain;
      transform: translate(-50%, -50%);
    }
    #hand.left { transform: translate(-50%, -50%) scaleX(-1); }
    #message {
      padding: 8vw;
      color: #f8fafc;
      font: 700 clamp(3rem, 7vw, 7rem)/1.2 Arial, Helvetica, sans-serif;
      white-space: pre-line;
    }
    #message.error { color: #fb7185; }
    #fullscreen-toggle {
      width: min(22rem, 92vw);
      height: 3.5rem;
      border: 0;
      border-radius: 0.75rem;
      background: #2563eb;
      color: #fff;
      font: 700 1.1rem/1 Arial, Helvetica, sans-serif;
      cursor: pointer;
    }
    #fullscreen-toggle:hover { background: #1d4ed8; }
    #fullscreen-toggle:focus-visible {
      outline: 3px solid #93c5fd;
      outline-offset: 3px;
    }
    body:not(.control-only) #fullscreen-toggle { display: none; }
    #trial-progress-page {
      width: 100%;
      min-height: 100%;
      padding: 8vh 8vw;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0f19;
      color: #f8fafc;
    }
    body.control-only #trial-progress-page { display: none; }
    #trial-progress-card {
      width: min(760px, 100%);
      padding: clamp(1.4rem, 3vw, 2.2rem);
      border: 1px solid #334155;
      border-radius: 1rem;
      background: #111827;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
    }
    #trial-progress-title {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1rem;
      font: 800 clamp(1.1rem, 2.2vw, 1.6rem)/1.3 Arial, Helvetica, sans-serif;
    }
    #trial-progress-track {
      width: 100%;
      height: 0.9rem;
      overflow: hidden;
      border-radius: 999px;
      background: #334155;
    }
    #trial-progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: #39ff14;
      transition: width 180ms ease-out;
    }
    #trial-progress-hint {
      margin-top: 0.9rem;
      color: #94a3b8;
      font: 500 0.95rem/1.45 Arial, Helvetica, sans-serif;
      text-align: center;
    }
  </style>
</head>
<body>
  <main id="surface" aria-live="off">
    <div id="fixation" class="hidden" role="img" aria-label="绿色注视十字">+</div>
    <img id="hand" class="hidden" alt="手部开合动作">
    <div id="arrow" class="hidden" role="img"></div>
    <div id="message" class="hidden"></div>
    <button id="fullscreen-toggle" type="button">进入电脑全屏</button>
  </main>
  <section id="trial-progress-page" aria-label="正式采集有效 trial 进度">
    <div id="trial-progress-card">
      <div id="trial-progress-title">
        <span id="trial-progress-count">已完成 0 / 900 个有效 trial</span>
        <span id="trial-progress-percent">0.0%</span>
      </div>
      <div id="trial-progress-track" role="progressbar"
           aria-valuemin="0" aria-valuemax="900" aria-valuenow="0">
        <div id="trial-progress-fill"></div>
      </div>
      <div id="trial-progress-hint">向上滚动返回刺激画面；作废的 attempt 不计入进度</div>
    </div>
  </section>
  <script>
    const HAND_ASSET = "hand-grasp-recorded-v2-30fps.webp?v=motion-clean-v1";
    const fixation = document.getElementById("fixation");
    const arrow = document.getElementById("arrow");
    const message = document.getElementById("message");
    const fullscreenToggle = document.getElementById("fullscreen-toggle");
    const trialProgressCount = document.getElementById("trial-progress-count");
    const trialProgressPercent = document.getElementById("trial-progress-percent");
    const trialProgressTrack = document.getElementById("trial-progress-track");
    const trialProgressFill = document.getElementById("trial-progress-fill");
    let hand = document.getElementById("hand");
    let currentSignature = null;

    // Decode the animation before the first cue so its first display does not
    // expose the browser's image-loading background.
    const handPreload = new Image();
    handPreload.src = HAND_ASSET;

    function send(type, data = {}) {
      window.parent.postMessage({ isStreamlitMessage: true, type, ...data }, "*");
    }

    function hideAll() {
      fixation.classList.add("hidden");
      hand.classList.add("hidden");
      arrow.classList.add("hidden");
      message.classList.add("hidden");
      message.classList.remove("error");
    }

    function restartHand(label) {
      const replacement = hand.cloneNode(false);
      replacement.className = label === "left" ? "left" : "";
      replacement.alt = label === "left" ? "左手开合动作" : "右手开合动作";
      replacement.src = HAND_ASSET;
      hand.replaceWith(replacement);
      hand = replacement;
    }

    function fullscreenDocument() {
      try {
        return window.parent.document;
      } catch (_error) {
        return document;
      }
    }

    function updateFullscreenLabel() {
      const hostDocument = fullscreenDocument();
      fullscreenToggle.textContent = hostDocument.fullscreenElement
        ? "退出电脑全屏（也可按 Esc）"
        : "进入电脑全屏";
    }

    async function toggleComputerFullscreen() {
      const hostDocument = fullscreenDocument();
      try {
        if (hostDocument.fullscreenElement) {
          await hostDocument.exitFullscreen();
        } else {
          await hostDocument.documentElement.requestFullscreen({ navigationUI: "hide" });
        }
      } catch (_error) {
        fullscreenToggle.textContent = "全屏被浏览器阻止，请再点一次";
      }
      updateFullscreenLabel();
    }

    fullscreenToggle.addEventListener("click", toggleComputerFullscreen);
    fullscreenDocument().addEventListener("fullscreenchange", updateFullscreenLabel);

    function updateTrialProgress(args) {
      const total = Math.max(0, Number.parseInt(args.total_trials || 0, 10) || 0);
      const requestedCompleted = Math.max(
        0,
        Number.parseInt(args.completed_trials || 0, 10) || 0,
      );
      const completed = total > 0 ? Math.min(requestedCompleted, total) : 0;
      const percent = total > 0 ? (100 * completed / total) : 0;
      trialProgressCount.textContent = `已完成 ${completed} / ${total} 个有效 trial`;
      trialProgressPercent.textContent = `${percent.toFixed(1)}%`;
      trialProgressTrack.setAttribute("aria-valuemax", String(total));
      trialProgressTrack.setAttribute("aria-valuenow", String(completed));
      trialProgressFill.style.width = `${percent.toFixed(3)}%`;
    }

    function render(args) {
      const controlOnly = Boolean(args.control_only);
      const stage = String(args.stage || "blank");
      const label = String(args.label || "");
      const text = String(args.message || "");
      updateTrialProgress(args);
      const signature = `${controlOnly}\u0000${stage}\u0000${label}\u0000${text}`;

      // Streamlit polls for button state every 50 ms. The iframe and image DOM
      // must remain untouched until the protocol stage actually changes.
      if (signature === currentSignature) return;
      currentSignature = signature;
      hideAll();

      if (controlOnly) {
        document.body.classList.add("control-only");
        updateFullscreenLabel();
        send("streamlit:setFrameHeight", { height: 72 });
        return;
      }
      document.body.classList.remove("control-only");
      send("streamlit:setFrameHeight", { height: Math.max(screen.height, 720) });

      if (stage === "ready" || stage === "fixation") {
        fixation.classList.remove("hidden");
      } else if (stage === "hand_cue") {
        restartHand(label);
      } else if (stage === "motor_imagery") {
        arrow.textContent = label === "left" ? "←" : "→";
        arrow.setAttribute("aria-label", label === "left" ? "左箭头" : "右箭头");
        arrow.classList.remove("hidden");
      } else if (stage === "break") {
        message.textContent = text || "休息";
        message.classList.remove("hidden");
      } else if (stage === "complete") {
        message.textContent = "实验结束\n请等待工作人员";
        message.classList.remove("hidden");
      } else if (stage === "error") {
        message.textContent = text || "执行失败";
        message.classList.add("error");
        message.classList.remove("hidden");
      }
    }

    window.addEventListener("message", (event) => {
      if (event.data && event.data.type === "streamlit:render") {
        render(event.data.args || {});
      }
    });

    send("streamlit:componentReady", { apiVersion: 1 });
    send("streamlit:setFrameHeight", { height: 72 });
  </script>
</body>
</html>
